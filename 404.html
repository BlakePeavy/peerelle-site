<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Peerelle</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0D9488">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/andika-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <style id="site-css">
/* Peerelle shared styles. Inlined into each page by tools/inline-css.py */
/* Andika, self-hosted latin subset */
@font-face{font-family:"Andika";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/andika-400.woff2) format("woff2")}
@font-face{font-family:"Andika";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/andika-700.woff2) format("woff2")}
@font-face{font-family:"Andika";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/andika-400i.woff2) format("woff2")}
:root {
  --teal: #0D9488;
  --teal-dark: #0F766E;
  --teal-soft: #CCFBF1;
  --cream: #F7F5F0;
  --white: #FFFFFF;
  --ink: #1C1917;
  --muted: #57534E;
  --border: #E7E5E4;
  --radius: 12px;
  --shadow: 0 4px 24px rgba(13, 148, 136, 0.08);
  --max: 720px;
  --font: "Andika", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: var(--font);
  font-size: 1.0625rem;
  line-height: 1.65;
  color: var(--ink);
  background: var(--cream);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

img {
  max-width: 100%;
  height: auto;
}

a {
  color: var(--teal-dark);
  text-decoration-thickness: 1.5px;
  text-underline-offset: 0.15em;
}

a:hover {
  color: var(--teal);
}

a:focus-visible {
  outline: 3px solid var(--teal);
  outline-offset: 3px;
  border-radius: 2px;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--teal);
  color: var(--white);
  padding: 0.75rem 1rem;
  z-index: 100;
  text-decoration: none;
  font-weight: 700;
}

.skip-link:focus {
  left: 0.5rem;
  top: 0.5rem;
}

.site-header {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 50;
}

.site-header .inner,
.site-footer .inner,
main .inner {
  width: min(100% - 2rem, 960px);
  margin-inline: auto;
}

.site-header .inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.85rem 0;
  flex-wrap: wrap;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  text-decoration: none;
  color: var(--ink);
  font-weight: 700;
  font-size: 1.2rem;
  letter-spacing: -0.02em;
}

.brand:hover {
  color: var(--teal-dark);
}

.brand-mark {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
}

.nav {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem 1.1rem;
  list-style: none;
  margin: 0;
  padding: 0;
}

.nav a {
  text-decoration: none;
  color: var(--muted);
  font-weight: 600;
  font-size: 0.95rem;
}

.nav a:hover,
.nav a[aria-current="page"] {
  color: var(--teal-dark);
}

main {
  flex: 1;
  padding: 2rem 0 3.5rem;
}

.hero {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: calc(var(--radius) + 4px);
  box-shadow: var(--shadow);
  padding: 2rem 1.5rem;
  margin-bottom: 2rem;
}

@media (min-width: 640px) {
  .hero {
    padding: 2.75rem 2.5rem;
  }
}

.eyebrow {
  display: inline-block;
  background: var(--teal-soft);
  color: var(--teal-dark);
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 0.35rem 0.7rem;
  border-radius: 999px;
  margin: 0 0 1rem;
}

h1 {
  font-size: clamp(1.75rem, 4vw, 2.4rem);
  line-height: 1.2;
  letter-spacing: -0.03em;
  margin: 0 0 0.75rem;
  color: var(--ink);
}

h2 {
  font-size: clamp(1.35rem, 3vw, 1.65rem);
  line-height: 1.25;
  letter-spacing: -0.02em;
  margin: 0 0 1rem;
  color: var(--ink);
}

h3 {
  font-size: 1.1rem;
  margin: 0 0 0.4rem;
  color: var(--ink);
}

.lead {
  font-size: 1.15rem;
  color: var(--muted);
  margin: 0 0 1.5rem;
  max-width: 40ch;
}

.pill-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin: 0 0 1.75rem;
  padding: 0;
  list-style: none;
}

.pill {
  background: var(--cream);
  border: 1px solid var(--border);
  color: var(--ink);
  font-size: 0.9rem;
  font-weight: 600;
  padding: 0.4rem 0.75rem;
  border-radius: 999px;
}

.store-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 0.75rem;
  align-items: center;
}

.store-badge {
  display: inline-flex;
  align-items: center;
  line-height: 0;
  text-decoration: none;
  border-radius: 8px;
}

.store-badge:focus-visible {
  outline: 3px solid var(--teal);
  outline-offset: 3px;
}

.store-badge img {
  display: block;
  height: 40px;
  width: auto;
}

.store-badge--play img {
  height: 40px;
}

.store-badge.is-pending {
  opacity: 0.72;
  cursor: default;
  pointer-events: none;
}

.store-badge.is-pending:focus {
  outline: none;
}

.section {
  margin-bottom: 2.25rem;
}

.section-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
}

.steps {
  display: grid;
  gap: 1rem;
  list-style: none;
  margin: 0;
  padding: 0;
  counter-reset: step;
}

@media (min-width: 640px) {
  .steps {
    grid-template-columns: 1fr 1fr;
  }
}

.step {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.25rem 1.25rem 1.35rem;
  position: relative;
}

.step::before {
  counter-increment: step;
  content: counter(step);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.75rem;
  height: 1.75rem;
  border-radius: 999px;
  background: var(--teal);
  color: var(--white);
  font-weight: 700;
  font-size: 0.85rem;
  margin-bottom: 0.65rem;
}

.step p {
  margin: 0;
  color: var(--muted);
  font-size: 0.98rem;
}

.privacy-callout {
  display: grid;
  gap: 1rem;
  background: linear-gradient(135deg, var(--teal-soft), var(--white));
  border: 1px solid #99F6E4;
  border-radius: var(--radius);
  padding: 1.5rem;
}

.privacy-callout p {
  margin: 0;
  color: var(--ink);
}

.privacy-callout strong {
  color: var(--teal-dark);
}

.links-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem 1.25rem;
  margin-top: 1.25rem;
}

.prose {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  max-width: var(--max);
}

.prose :first-child {
  margin-top: 0;
}

.prose h2 {
  margin-top: 1.75rem;
  padding-top: 1.25rem;
  border-top: 1px solid var(--border);
  font-size: 1.2rem;
}

.prose h2:first-of-type {
  border-top: none;
  padding-top: 0;
}

.prose p,
.prose ul {
  color: var(--muted);
}

.prose ul {
  padding-left: 1.25rem;
}

.prose li {
  margin-bottom: 0.4rem;
}

.prose code {
  font-size: 0.92em;
  background: var(--cream);
  padding: 0.1em 0.35em;
  border-radius: 4px;
}

.meta {
  font-size: 0.9rem;
  color: var(--muted);
  margin: 0 0 1.25rem;
}

.faq details {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0;
  margin-bottom: 0.65rem;
  overflow: hidden;
}

.faq summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  font-weight: 700;
  cursor: pointer;
  color: var(--ink);
  list-style: none;
  padding: 0.95rem 1.1rem;
  line-height: 1.35;
}

.faq summary::-webkit-details-marker {
  display: none;
}

.faq summary::marker {
  content: "";
  display: none;
}

.faq summary::after {
  content: "";
  flex: 0 0 auto;
  width: 0.45rem;
  height: 0.45rem;
  margin-top: -0.15rem;
  border-right: 2px solid var(--muted);
  border-bottom: 2px solid var(--muted);
  transform: rotate(45deg);
  transition: transform 0.15s ease;
}

.faq details[open] summary {
  color: var(--teal-dark);
  border-bottom: 1px solid var(--border);
}

.faq details[open] summary::after {
  margin-top: 0.15rem;
  transform: rotate(225deg);
}

.faq summary:focus-visible {
  outline: 3px solid var(--teal);
  outline-offset: -3px;
}

.faq details p {
  margin: 0;
  padding: 0.85rem 1.1rem 1rem;
  color: var(--muted);
}

.contact-box {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  margin-top: 1.5rem;
}

.contact-box a {
  font-weight: 700;
}

.site-footer {
  background: var(--white);
  border-top: 1px solid var(--border);
  padding: 1.5rem 0;
  font-size: 0.9rem;
  color: var(--muted);
}

.site-footer .inner {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem 1.5rem;
  justify-content: space-between;
  align-items: center;
}

.site-footer nav {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem 1.25rem;
}

.site-footer a {
  text-decoration: none;
  color: var(--muted);
  font-weight: 600;
}

.site-footer a:hover {
  color: var(--teal-dark);
}

.error-page {
  text-align: center;
  padding: 3rem 1rem;
}

.error-page .code {
  font-size: 4rem;
  font-weight: 700;
  color: var(--teal);
  line-height: 1;
  margin: 0 0 0.5rem;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0.65rem 1.25rem;
  background: var(--teal);
  color: var(--white);
  font-weight: 700;
  text-decoration: none;
  border-radius: 10px;
  border: 2px solid var(--teal);
}

.btn:hover {
  background: var(--teal-dark);
  border-color: var(--teal-dark);
  color: var(--white);
}
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="inner">
      <a class="brand" href="index.html">
        <img class="brand-mark" src="favicon.svg" width="36" height="36" alt="">
        <span>Peerelle</span>
      </a>
      <nav aria-label="Primary">
        <ul class="nav">
          <li><a href="index.html">Home</a></li>
          <li><a href="privacy.html">Privacy</a></li>
          <li><a href="support.html">Support</a></li>
          <li><a href="terms.html">Terms</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <div class="inner error-page">
      <p class="code" aria-hidden="true">404</p>
      <h1>Page not found</h1>
      <p style="color: var(--muted); margin: 0 0 1.5rem;">That link does not match anything on peerelle.app.</p>
      <a class="btn" href="index.html">Back to home</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="inner">
      <p>© 2026 Peerelle</p>
      <nav aria-label="Footer">
        <a href="privacy.html">Privacy</a>
        <a href="support.html">Support</a>
        <a href="terms.html">Terms</a>
        <a href="mailto:support@peerelle.app">Contact</a>
      </nav>
    </div>
  </footer>
</body>
</html>
